<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VitoSynth AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#050505',
              surface: 'rgba(255, 255, 255, 0.03)',
              primary: '#00F5E1', // Neon Cyan
              primaryDark: '#00A8B5',
              secondary: '#A78BFA', // Soft Purple
              accent: '#FF2E63',
              muted: '#9CA3AF'
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['SF Mono', 'ui-monospace', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                'from': { boxShadow: '0 0 10px -5px #00F5E1' },
                'to': { boxShadow: '0 0 20px 5px rgba(0, 245, 225, 0.3)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020203;
        color: #F3F4F6;
        background-image: 
          radial-gradient(circle at 15% 50%, rgba(0, 168, 181, 0.08) 0%, transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 25%);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Liquid Glass Utility Classes */
      .glass-panel {
        background: rgba(20, 20, 24, 0.4);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 
          0 2px 4px -1px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      
      .glass-panel-hover:hover {
        transform: translateY(-4px);
        box-shadow: 
          0 20px 25px -5px rgba(0, 0, 0, 0.2), 
          0 10px 10px -5px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        overflow: hidden;
      }
      
      /* Top highlight (Static) */
      .glass-button::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
        pointer-events: none;
      }

      /* Mouse spotlight refraction (Dynamic) */
      .glass-button::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          150px circle at var(--x, 50%) var(--y, 50%),
          rgba(255, 255, 255, 0.25),
          transparent 100%
        );
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
        z-index: 10;
        mix-blend-mode: overlay;
      }

      .glass-button:hover::before {
        opacity: 1;
      }

      .glass-button:hover {
        background: rgba(255, 255, 255, 0.06);
        transform: scale(1.02);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 
          0 0 20px rgba(0, 245, 225, 0.05),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }
      
      .glass-button:active {
        transform: scale(0.97);
      }
      
      .glass-input {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
      }
      
      .glass-input:focus {
        background: rgba(0, 0, 0, 0.4);
        border-color: #00F5E1;
        box-shadow: 0 0 0 2px rgba(0, 245, 225, 0.1);
        outline: none;
      }

      /* Custom scrollbar for premium feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .text-glow {
        text-shadow: 0 0 20px rgba(0, 245, 225, 0.3);
      }

      /* Selection Color */
      ::selection {
        background: rgba(0, 245, 225, 0.2);
        color: #fff;
      }
    </style>
  
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Global mouse tracking for liquid glass buttons
      document.addEventListener('mousemove', (e) => {
        const btn = e.target.closest('.glass-button');
        if (btn) {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          btn.style.setProperty('--x', `${x}px`);
          btn.style.setProperty('--y', `${y}px`);
        }
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
