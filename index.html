<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VitoSynth AI — Metabolic Digital Twin</title>
    <meta name="description" content="VitoSynth AI: Real-time metabolic simulation, food analysis, and personalized health insights powered by Llama 4." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- All Tailwind + custom styles are compiled into /assets/*.css via PostCSS -->
    <style>
      /* Critical above-the-fold styles — ensures body is dark even before CSS bundle loads */
      body {
        background-color: #020203;
        color: #F3F4F6;
        background-image:
          radial-gradient(circle at 15% 50%, rgba(0, 168, 181, 0.08) 0%, transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 25%);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
      }

      /* Liquid Glass Utility Classes — also in index.css for completeness */
      .glass-panel {
        background: rgba(20, 20, 24, 0.4);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .glass-panel-hover:hover {
        transform: translateY(-4px);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.2),
          0 10px 10px -5px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        overflow: hidden;
      }

      .glass-button::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
        pointer-events: none;
      }

      .glass-button::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          150px circle at var(--x, 50%) var(--y, 50%),
          rgba(255, 255, 255, 0.25),
          transparent 100%
        );
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
        z-index: 10;
        mix-blend-mode: overlay;
      }

      .glass-button:hover::before { opacity: 1; }

      .glass-button:hover {
        background: rgba(255, 255, 255, 0.06);
        transform: scale(1.02);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow:
          0 0 20px rgba(0, 245, 225, 0.05),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }

      .glass-button:active { transform: scale(0.97); }

      .glass-input {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
      }

      .glass-input:focus {
        background: rgba(0, 0, 0, 0.4);
        border-color: #00F5E1;
        box-shadow: 0 0 0 2px rgba(0, 245, 225, 0.1);
        outline: none;
      }

      .text-glow { text-shadow: 0 0 20px rgba(0, 245, 225, 0.3); }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }

      ::selection { background: rgba(0, 245, 225, 0.2); color: #fff; }

      /* Loading splash — shown before React mounts */
      #loading-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #020203; z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #loading-splash.hidden { opacity: 0; pointer-events: none; }
      .splash-ring {
        width: 60px; height: 60px;
        border: 2px solid rgba(0,245,225,0.1);
        border-top-color: #00F5E1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading splash shown before React hydrates -->
    <div id="loading-splash">
      <div class="splash-ring"></div>
      <p style="color:#00F5E1; font-size:13px; margin-top:20px; letter-spacing:0.15em; font-weight:600;">VITOSYNTH AI</p>
      <p style="color:#52525b; font-size:11px; margin-top:6px;">Initializing Digital Twin...</p>
    </div>

    <div id="root"></div>

    <script>
      // Hide loading splash once React mounts
      window.__hideSplash = function() {
        var s = document.getElementById('loading-splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 600); }
      };
      // Global mouse tracking for liquid glass buttons
      document.addEventListener('mousemove', function(e) {
        var btn = e.target.closest('.glass-button');
        if (btn) {
          var rect = btn.getBoundingClientRect();
          btn.style.setProperty('--x', (e.clientX - rect.left) + 'px');
          btn.style.setProperty('--y', (e.clientY - rect.top) + 'px');
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
